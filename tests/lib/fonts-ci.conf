<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Emulate the GitHub ubuntu runner: its fontconfig resolves sans-serif / system-ui to DejaVu Sans
     (no Noto Sans, no Ubuntu font). tests/lib/browser-checks.js sets FONTCONFIG_FILE to this file by default (GC_SYSTEM_FONTS=1 to opt out),
     so local runs render text with the same metrics as CI. Found 18 Nov: Noto Sans locally vs DejaVu Sans on CI
     moved targets by a few px and hid CI-only axe target-size failures. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont>
    <glob>*/NotoSans-*</glob><glob>*/NotoSans[*</glob><glob>*/Ubuntu*</glob><glob>*/Roboto*</glob>
    <pattern><patelt name="family"><string>Noto Sans</string></patelt></pattern>
    <pattern><patelt name="family"><string>Ubuntu</string></patelt></pattern>
    <pattern><patelt name="family"><string>Roboto</string></patelt></pattern>
  </rejectfont></selectfont>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
