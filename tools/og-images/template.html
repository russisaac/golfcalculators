<!doctype html>
<!-- Share-image template (1200x630). Rendered by render.js; colours, radii and
     spacing come from the site's gc.css tokens. Not published (see netlify.toml). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../gc.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--card);color:var(--ink);position:relative}
  .wrap{position:absolute;inset:0 0 132px 0;padding:72px 80px 0;display:flex;gap:56px;align-items:flex-start}
  .txt{flex:1;min-width:0}
  .kicker{display:inline-block;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent-line);border-radius:999px;padding:8px 22px;font-size:26px;font-weight:700;letter-spacing:.01em}
  h1{font-size:84px;line-height:1.04;font-weight:800;letter-spacing:-.025em;margin:32px 0 0;color:var(--ink)}
  h1,p{text-wrap:balance}
  p{font-size:38px;line-height:1.3;color:var(--ink-2);margin:26px 0 0;font-weight:500}
  .logo{width:224px;height:224px;flex:none;margin-top:8px;border-radius:50px;box-shadow:var(--shadow)}
  .band{position:absolute;left:0;right:0;bottom:0;height:132px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;padding:0 80px}
  .site{font-size:42px;font-weight:800;letter-spacing:-.01em}
  .tag{font-size:28px;font-weight:600;opacity:.92}
</style>
</head>
<body>
  <div class="wrap">
    <div class="txt">
      <span class="kicker" id="kicker"></span>
      <h1 id="title"></h1>
      <p id="value"></p>
    </div>
    <img class="logo" src="../../favicon.svg" alt="">
  </div>
  <div class="band"><span class="site">golfcalculators.com</span><span class="tag" id="tagline"></span></div>
</body>
</html>
