<!-- Shared design system: verbatim copy of /gc.css, inlined so the first paint needs no extra request (LCP). tests/run fails if it drifts from gc.css. -->
<style data-src="/gc.css">/* gc.css: golfcalculators.com shared design system (v1, Nov 2026)
   One accent, neutrals, 4px spacing scale, 4 font sizes (14/16/22/30),
   shared header nav, card, button, stepper, segmented, hero, toast, footer. */
:root{
  --accent:#166534; --accent-ink:#fff; --accent-soft:#dcfce7; --accent-line:#86efac;
  --ink:#0f172a; --ink-2:#334155; --muted:#475569; --line:#e2e8f0; --bg:#f6f8f7; --card:#fff;
  --warn:#92400e; --warn-soft:#fef3c7; --danger:#b91c1c;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --fs-sm:14px; --fs-md:16px; --fs-lg:22px; --fs-xl:30px;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);
  --tap:48px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:var(--fs-md);line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:var(--fs-lg)}
h2{font-size:var(--fs-md)}
p{margin:0}
a{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}

/* Header + nav */
.gc-header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gc-header-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3)}
.gc-brand{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:var(--tap);text-decoration:none}
.gc-brand img{display:block;width:28px;height:28px;border-radius:7px}
.gc-nav{display:flex;flex:1;justify-content:flex-end;gap:var(--s1)}
.gc-nav a{display:flex;align-items:center;min-height:var(--tap);padding:0 var(--s2);font-size:var(--fs-sm);font-weight:600;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.gc-nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

/* Layout */
.gc-main{max-width:640px;margin:0 auto;padding:var(--s4) var(--s4) var(--s8)}
.gc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--shadow)}
.gc-stack>*+*{margin-top:var(--s3)}
.gc-muted{color:var(--muted);font-size:var(--fs-sm)}
.gc-label{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);margin-bottom:var(--s1)}

/* Buttons */
.gc-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);min-width:44px;padding:0 var(--s5);border-radius:var(--r-sm);border:1px solid transparent;font:inherit;font-weight:600;font-size:var(--fs-md);cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.gc-btn-primary{background:var(--accent);color:var(--accent-ink)}
.gc-btn-secondary{background:var(--card);color:var(--ink);border-color:#cbd5e1}
.gc-btn-ghost{background:transparent;color:var(--accent)}
.gc-btn-block{width:100%}
.gc-btn:disabled{opacity:.45;cursor:not-allowed}

/* Inputs */
.gc-input{width:100%;min-height:var(--tap);padding:0 var(--s3);font:inherit;font-size:var(--fs-md);color:var(--ink);background:var(--card);border:1px solid #94a3b8;border-radius:var(--r-sm)}

/* Stepper */
.gc-stepper{flex:none;display:inline-flex;align-items:center;border:1px solid #94a3b8;border-radius:var(--r-sm);background:var(--card);overflow:hidden}
.gc-stepper button{width:var(--tap);height:var(--tap);border:0;background:#f1f5f9;color:var(--ink);font-size:var(--fs-lg);font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gc-stepper button:active{background:var(--accent-soft)}
.gc-stepper input{width:52px;height:var(--tap);border:0;text-align:center;font:inherit;font-size:var(--fs-lg);font-weight:700;color:var(--ink);background:transparent}
.gc-stepper.is-default input{color:var(--muted)}

/* Segmented control (radio group) */
.gc-seg{display:flex;border:1px solid #94a3b8;border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.gc-seg label{flex:1;position:relative}
.gc-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.gc-seg span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 var(--s2);font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);text-align:center}
.gc-seg label+label span{border-left:1px solid #cbd5e1}
.gc-seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.gc-seg input:focus-visible+span{outline:3px solid #2563eb;outline-offset:-3px}

/* Hero result */
.gc-hero{background:var(--accent);color:#fff;border-radius:var(--r);padding:var(--s5) var(--s4);box-shadow:var(--shadow)}
.gc-hero .gc-kicker{font-size:var(--fs-sm);font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.gc-hero .gc-big{font-size:var(--fs-xl);font-weight:800;line-height:1.2;margin-top:var(--s2)}
.gc-hero .gc-big+.gc-big{margin-top:var(--s1)}

/* Next-step cards */
.gc-next{display:grid;gap:var(--s3)}
.gc-next a{display:block;padding:var(--s4);min-height:var(--tap);background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.gc-next a strong{display:block;color:var(--accent)}
.gc-next a span{font-size:var(--fs-sm);color:var(--muted)}

/* Toast */
.gc-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:var(--s2) var(--s4);border-radius:999px;font-size:var(--fs-sm);font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.gc-toast.show{opacity:1}

/* Footer */
.gc-footer{text-align:center;padding:var(--s4) var(--s4) var(--s8);color:var(--muted);font-size:var(--fs-sm)}
.gc-footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s2);color:var(--muted)}

/* Your courses (gc-courses.js) */
.gc-courses{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.gc-courses li{display:flex;gap:var(--s2);align-items:stretch}
.gc-courses-use{flex:1;min-width:0;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:var(--s2) var(--s3);gap:0}
.gc-courses-use b{display:block;max-width:100%;overflow-wrap:anywhere}
.gc-courses-use span{font-size:var(--fs-sm);font-weight:400;color:var(--muted)}
.gc-courses-del{flex:none;width:var(--tap);padding:0;color:var(--muted)}
.gc-courses-ask{flex-wrap:wrap;align-items:center;background:var(--warn-soft);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}
.gc-courses-ask>span:first-child{flex:1 1 100%;overflow-wrap:anywhere}
.gc-courses-yn{display:flex;gap:var(--s2)}
.gc-ask{border-left:4px solid var(--accent)}
.gc-ask h2{margin-bottom:var(--s1)}
.gc-ask .gc-ask-btns{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
/* v9 P4 feedback: "Send feedback" line after a result */
.gc-fb{margin-top:var(--s3)}
.gc-fb a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--accent)}
/* v9 P5 Add to Home Screen tip (gc-a2hs.js) */
.gc-a2hs-t,.gc-a2hs-p{margin:0}
.gc-a2hs-p{margin:var(--s1) 0 var(--s2)}
.gc-a2hs-ico{vertical-align:-3px;color:var(--accent)}
.gc-a2hs-b{display:flex;flex-wrap:wrap;gap:var(--s2)}
</style>
<style>
.fb h1{font-size:var(--fs-xl);margin:var(--s2) 0 var(--s2)}
.fb-f{display:grid;gap:var(--s4);margin-top:var(--s4)}
.fb-f textarea.gc-input{min-height:88px;padding:var(--s2) var(--s3);resize:vertical;line-height:1.4}
.fb-f select.gc-input{appearance:auto}
.fb-hp,.fb-hp[hidden]{display:none}
.fb-err{color:#b91c1c;font-weight:600;margin:0}
.fb-err[hidden]{display:none}
</style>
<!-- Analytics (v9 P6): verbatim copy of /gc-ga.js. Production hostnames only; see /privacy. tests/run fails if it drifts. -->
<script data-src="/gc-ga.js">/* gc-ga.js: golfcalculators.com Google Analytics 4 (G-DH32H3GWKE), v9 P6, Nov 2026. Inlined verbatim into every page
   as <script data-src="/gc-ga.js">; tests/run fails if a copy drifts from this file.
   - Loads only on the production hostnames (golfcalculators.com, www.): previews, drafts and localhost send nothing.
   - page_location is always origin + path + the utm_* parameters only: never the #fragment (shared result links
     carry names and scores in #r=) and never other query values (such as a handicap passed back with ?dh=).
   - Four anonymous events, each with one parameter, the tool ("skins" or "stableford"): round_settled,
     result_shared, shared_link_opened, start_own_from_viewer. Anything else is dropped. */
(function () {
  var ID = 'G-DH32H3GWKE', ON = location.hostname === 'golfcalculators.com' || location.hostname === 'www.golfcalculators.com';
  var EVENTS = ['round_settled', 'result_shared', 'shared_link_opened', 'start_own_from_viewer'], TOOLS = ['skins', 'stableford'];
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  function pageLocation() {
    var keep = (location.search || '').replace(/^\?/, '').split('&').filter(function (kv) { return /^utm_(source|medium|campaign|term|content)=[A-Za-z0-9_.-]*$/.test(kv); });
    return location.origin + location.pathname + (keep.length ? '?' + keep.join('&') : '');
  }
  if (ON) {
    window.gtag = gtag;
    var tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
    document.head.appendChild(tag);
    gtag('js', new Date());
    gtag('config', ID, { page_location: pageLocation() });
    var reset = function () { gtag('set', { page_location: pageLocation() }); };
    addEventListener('popstate', reset);
    addEventListener('hashchange', reset);
  }
  window.gcTrack = function (name, tool) {
    if (!ON || EVENTS.indexOf(name) < 0 || TOOLS.indexOf(tool) < 0) return false;
    gtag('event', name, { tool: tool });
    return true;
  };
})();
</script>
</head>
<body class="fb">
<header class="gc-header"><div class="gc-header-in">
  <a class="gc-brand" href="/" aria-label="Golf Calculators home"><img src="/favicon.svg" alt="" width="28" height="28"></a>
  <nav class="gc-nav" aria-label="Calculators">
    <a href="/skins">Skins</a>
    <a href="/stableford">Stableford</a>
    <a href="/daily-handicap">Daily Hcp</a>
  </nav>
</div></header>
<main class="gc-main">
<h1>Send feedback</h1>
<p class="gc-muted">One minute. Fill in any of the boxes; your email is optional.</p>
<form class="gc-card fb-f" id="fb-form" name="feedback" method="POST" action="/feedback-thanks" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="feedback">
  <p class="fb-hp" hidden><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
  <div><label class="gc-label" for="fb-page">Which page?</label>
    <select class="gc-input" id="fb-page" name="page">
      <option value="skins">Skins calculator</option>
      <option value="stableford">Stableford calculator</option>
      <option value="daily-handicap">Daily Handicap calculator</option>
      <option value="home">Home page</option>
      <option value="privacy">Privacy page</option>
      <option value="other" selected>Something else</option>
    </select></div>
  <div><label class="gc-label" for="fb-worked">What worked?</label>
    <textarea class="gc-input" id="fb-worked" name="worked" rows="3" maxlength="2000"></textarea></div>
  <div><label class="gc-label" for="fb-didnt">What didn’t?</label>
    <textarea class="gc-input" id="fb-didnt" name="didnt" rows="3" maxlength="2000"></textarea></div>
  <div><label class="gc-label" for="fb-want">What would you want next?</label>
    <textarea class="gc-input" id="fb-want" name="want" rows="3" maxlength="2000"></textarea></div>
  <div><label class="gc-label" for="fb-email">Your email (optional, only if you’d like a reply)</label>
    <input class="gc-input" id="fb-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="200"></div>
  <p class="fb-err" id="fb-err" role="alert" hidden></p>
  <button type="submit" class="gc-btn gc-btn-primary gc-btn-block" id="fb-send">Send feedback</button>
  <p class="gc-muted" style="margin:0">Sent to us through Netlify, our web host. See <a href="/privacy#feedback">Privacy</a> for what we keep.</p>
</form>
</main>
<footer class="gc-footer"><a href="/feedback" aria-current="page">Feedback</a> · <a href="/privacy">Privacy</a> · golfcalculators.com</footer>
<script>
(function () { // the page is filled in from ?from= (known pages only); at least one box must have something in it
  var PAGES = ['skins', 'stableford', 'daily-handicap', 'home', 'privacy'];
  var q = new URLSearchParams(location.search).get('from'), sel = document.getElementById('fb-page');
  if (q && PAGES.indexOf(q) >= 0) sel.value = q;
  var form = document.getElementById('fb-form'), err = document.getElementById('fb-err');
  form.addEventListener('submit', function (e) {
    var any = ['fb-worked', 'fb-didnt', 'fb-want'].some(function (id) { return document.getElementById(id).value.trim(); });
    if (any) return;
    e.preventDefault(); err.hidden = false; err.textContent = 'Write something in at least one box, then send.';
    document.getElementById('fb-worked').focus();
  });
})();
</script>
